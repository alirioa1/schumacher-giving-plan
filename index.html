  <script>
    
document.addEventListener('DOMContentLoaded', async function() {
  const loading = document.getElementById('__bundler_loading');
  function setStatus(msg) { if (loading) loading.textContent = msg; }

  const FONT_MIME = /^(font[/]|application[/](x-)?font-|application[/]vnd\.ms-fontobject)/i;
  const MIME_TOKEN = /^[\w.+-]+[/][\w.+-]+$/;
  function toBase64(bytes) {
    let bin = '';
    for (let i = 0; i < bytes.length; i += 0x8000) {
      bin += String.fromCharCode.apply(null, bytes.subarray(i, i + 0x8000));
    }
    return btoa(bin);
  }

  // Error sink persists across replaceWith since it's on window, not the DOM.
  window.addEventListener('error', function(e) {
    // Failed resource loads (CSP-blocked links, scripts, images) fire plain
    // events at the element — warn only; real JS errors carry message/error.
    if (!e.message && !e.error && e.target && e.target !== window) {
      console.warn('[bundle] resource failed to load:',
        e.target.tagName, String(e.target.src || e.target.href || ''));
      return;
    }
    var p = document.body || document.documentElement;
    var d = document.getElementById('__bundler_err') || p.appendChild(document.createElement('div'));
    d.id = '__bundler_err';
    d.style.cssText = 'position:fixed;bottom:12px;left:12px;right:12px;font:12px/1.4 ui-monospace,monospace;background:#2a1215;color:#ff8a80;padding:10px 14px;border-radius:8px;border:1px solid #5c2b2e;z-index:99999;white-space:pre-wrap;max-height:40vh;overflow:auto';
    d.textContent = (d.textContent ? d.textContent + String.fromCharCode(10) : '') +
      '[bundle] ' + (e.message || e.type) +
      (e.filename ? ' (' + e.filename.slice(0, 60) + ':' + e.lineno + ')' : '');
  }, true);

  try {
    const manifestEl = document.querySelector('script[type="__bundler/manifest"]');
    const templateEl = document.querySelector('script[type="__bundler/template"]');
    if (!manifestEl || !templateEl) {
      setStatus('Error: missing bundle data');
      console.error('[bundler] Missing script tags — manifestEl:', !!manifestEl, 'templateEl:', !!templateEl);
      return;
    }

    const manifest = JSON.parse(manifestEl.textContent);
    let template = JSON.parse(templateEl.textContent);

    const uuids = Object.keys(manifest);
    setStatus('Unpacking ' + uuids.length + ' assets...');

    const blobUrls = {};
    const resourceBlobs = {};
    await Promise.all(uuids.map(async (uuid) => {
      const entry = manifest[uuid];
      try {
        const binaryStr = atob(entry.data);
        const bytes = new Uint8Array(binaryStr.length);
        for (let i = 0; i < binaryStr.length; i++) bytes[i] = binaryStr.charCodeAt(i);

        let finalBytes = bytes;
        if (entry.compressed) {
          if (typeof DecompressionStream !== 'undefined') {
            const ds = new DecompressionStream('gzip');
            const writer = ds.writable.getWriter();
            const reader = ds.readable.getReader();
            writer.write(bytes);
            writer.close();
            const chunks = [];
            let totalLen = 0;
            while (true) {
              const { done, value } = await reader.read();
              if (done) break;
              chunks.push(value);
              totalLen += value.length;
            }
            finalBytes = new Uint8Array(totalLen);
            let offset = 0;
            for (const chunk of chunks) { finalBytes.set(chunk, offset); offset += chunk.length; }
          } else {
            console.warn('DecompressionStream not available, asset ' + uuid + ' may not render');
          }
        }

        if (FONT_MIME.test(entry.mime) && MIME_TOKEN.test(entry.mime)) {
          // Strict artifact hosts allow font-src data: but not blob:.
          blobUrls[uuid] = 'data:' + entry.mime + ';base64,' +
            (entry.compressed ? toBase64(finalBytes) : entry.data);
        } else {
          const blob = new Blob([finalBytes], { type: entry.mime });
          blobUrls[uuid] = URL.createObjectURL(blob);
          resourceBlobs[blobUrls[uuid]] = blob;
        }
      } catch (err) {
        console.error('Failed to decode asset ' + uuid + ':', err);
        const blob = new Blob([], { type: entry.mime });
        blobUrls[uuid] = URL.createObjectURL(blob);
        resourceBlobs[blobUrls[uuid]] = blob;
      }
    }));

    const extResEl = document.querySelector('script[type="__bundler/ext_resources"]');
    const extResources = extResEl ? JSON.parse(extResEl.textContent) : [];
    const resourceMap = {};
    for (const entry of extResources) {
      if (blobUrls[entry.uuid]) resourceMap[entry.id] = blobUrls[entry.uuid];
    }

    // Artifact-host CSP (connect-src 'self') refuses fetch() of blob: URLs —
    // consumers read these Blobs directly. Survives the swap like the error sink.
    window.__resourceBlobs = resourceBlobs;

    setStatus('Rendering...');
    for (const uuid of uuids) template = template.split(uuid).join(blobUrls[uuid]);

    // Strip integrity + crossorigin — blob URLs from a file:// document inherit
    // a null origin, so crossorigin forces a CORS fetch that SRI then rejects.
    // The manifest bytes are ours; SRI protects against CDN compromise, not this.
    template = template.replace(/\s+integrity="[^"]*"/gi, '').replace(/\s+crossorigin="[^"]*"/gi, '');

    const resourceScript = '<script>window.__resources = ' +
      JSON.stringify(resourceMap).replace(/<\//g, '<\\/') +
      ';</' + 'script>';
    // Inject after <head> so the DOCTYPE stays first; prepending the script
    // would push the parser into quirks mode. DOMParser always emits a <head>
    // (synthesizing one if the source HTML omitted it) but may carry
    // attributes through, so match the full opening tag. slice() rather than
    // replace() keeps us clear of $-pattern substitution in resourceScript.
    const headOpen = template.match(/<head[^>]*>/i);
    if (headOpen) {
      const i = headOpen.index + headOpen[0].length;
      template = template.slice(0, i) + resourceScript + template.slice(i);
    }

    // Parse the template and swap the root element. Scripts inserted via
    // DOMParser/replaceWith are inert per spec — re-create each with
    // createElement so they execute, awaiting onload for src scripts to
    // preserve ordering (React before ReactDOM before Babel before text/babel).
    const doc = new DOMParser().parseFromString(template, 'text/html');
    document.documentElement.replaceWith(doc.documentElement);
    const dead = Array.from(document.scripts);
    for (const old of dead) {
      const s = document.createElement('script');
      for (const a of old.attributes) s.setAttribute(a.name, a.value);
      s.textContent = old.textContent;
      // text/babel scripts with a src: read and inline. transformScriptTags
      // does XHR against the src, but blob:null/ from a file:// origin is
      // silently dropped. Inlining makes it a plain inline babel script,
      // which transformScriptTags handles unconditionally.
      if ((s.type === 'text/babel' || s.type === 'text/jsx') && s.src) {
        const pre = resourceBlobs[s.src.split('#')[0]];
        s.textContent = pre ? await pre.text() : await (await fetch(s.src)).text();
        s.removeAttribute('src');
      }
      const p = s.src ? new Promise(function(r) { s.onload = s.onerror = r; }) : null;
      old.replaceWith(s);
      if (p) await p;
    }
    // Babel standalone auto-transforms type=text/babel on DOMContentLoaded,
    // which fired before we swapped the document. Trigger manually if present.
    if (window.Babel && typeof window.Babel.transformScriptTags === 'function') {
      window.Babel.transformScriptTags();
    }
  } catch (err) {
    setStatus('Error unpacking: ' + err.message);
    console.error('Bundle unpack error:', err);
  }
});

  <script type="__bundler/template">
"<!DOCTYPE html>\n<html><head>\n<meta charset=\"utf-8\">\n<meta name=\"viewport\" content=\"width=device-width, initial-scale=1\">\n<script src=\"3d9cca67-b9d5-4223-9d23-88dd76db9e2e\"><\u002Fscript>\n\n<\u002Fhead>\n<body>\n<x-dc>\n<helmet>\n  <style>/* ============================================================\n   IGI · Gospel Impact — Webfonts\n   Newsreader (serif display) · IBM Plex Sans (UI) · IBM Plex Mono (data)\n   Self-hosted via the Fontsource CDN (stable, versioned woff2) so the\n   families are declared as real @font-face rules (tracked + portable),\n   not an opaque Google Fonts @import.\n   ============================================================ */\n\n/* ---- Newsreader (serif display + big figures) ---- */\n@font-face {\n  font-family: 'Newsreader';\n  font-style: normal;\n  font-weight: 400;\n  font-display: swap;\n  src: url(\"53dd542f-8054-46ba-97d4-e6622a4ea703\") format('woff2');\n}\n@font-face {\n  font-family: 'Newsreader';\n  font-style: normal;\n  font-weight: 500;\n  font-display: swap;\n  src: url(\"8647e2cb-1ca0-4297-af90-a7b249b37b44\") format('woff2');\n}\n@font-face {\n  font-family: 'Newsreader';\n  font-style: normal;\n  font-weight: 600;\n  font-display: swap;\n  src: url(\"cbbc309c-4d5f-4bc4-8a62-c73d6892a0bc\") format('woff2');\n}\n@font-face {\n  font-family: 'Newsreader';\n  font-style: italic;\n  font-weight: 400;\n  font-display: swap;\n  src: url(\"d17c798c-0080-4daa-8aa7-71c78d0e8238\") format('woff2');\n}\n@font-face {\n  font-family: 'Newsreader';\n  font-style: italic;\n  font-weight: 500;\n  font-display: swap;\n  src: url(\"37525308-fc4d-4268-bdbe-e6a24f229b77\") format('woff2');\n}\n\n/* ---- IBM Plex Sans (all UI + body) ---- */\n@font-face {\n  font-family: 'IBM Plex Sans';\n  font-style: normal;\n  font-weight: 400;\n  font-display: swap;\n  src: url(\"ada0d6ca-0118-4204-90c9-63a668801ff2\") format('woff2');\n}\n@font-face {\n  font-family: 'IBM Plex Sans';\n  font-style: normal;\n  font-weight: 500;\n  font-display: swap;\n  src: url(\"c71ef571-384b-4cc5-862b-0ac1823c3358\") format('woff2');\n}\n@font-face {\n  font-family: 'IBM Plex Sans';\n  font-style: normal;\n  font-weight: 600;\n  font-display: swap;\n  src: url(\"d3cb9d3a-9f83-485f-bb76-1a204e509a4f\") format('woff2');\n}\n@font-face {\n  font-family: 'IBM Plex Sans';\n  font-style: normal;\n  font-weight: 700;\n  font-display: swap;\n  src: url(\"9385965e-4b25-4a3d-bd02-b1473ee36d4a\") format('woff2');\n}\n\n/* ---- IBM Plex Mono (figures, amounts, dates, IDs) ---- */\n@font-face {\n  font-family: 'IBM Plex Mono';\n  font-style: normal;\n  font-weight: 400;\n  font-display: swap;\n  src: url(\"07e0e7b8-f57a-4932-894b-2834820c2f0b\") format('woff2');\n}\n@font-face {\n  font-family: 'IBM Plex Mono';\n  font-style: normal;\n  font-weight: 500;\n  font-display: swap;\n  src: url(\"565b83b3-c6bc-44e4-b7d9-aa0cc54863df\") format('woff2');\n}\n@font-face {\n  font-family: 'IBM Plex Mono';\n  font-style: normal;\n  font-weight: 600;\n  font-display: swap;\n  src: url(\"704912c9-422d-4214-b29d-df505a9c6482\") format('woff2');\n}\n<\u002Fstyle>\n  <style>/* ============================================================\n   IGI · Gospel Impact — Color tokens\n   Warm-paper neutrals, deep navy brand, gold + teal accents.\n   ============================================================ */\n:root {\n  /* --- Brand core --- */\n  --navy-900: #06243E;   /* deepest — gradient bottoms */\n  --navy-800: #08243C;\n  --navy-700: #0B3357;   /* PRIMARY brand navy — sidebar, buttons, dark cards */\n  --navy-600: #0E3A5E;\n  --navy-500: #15517E;   /* raised navy surfaces (avatar chip) */\n  --cyan-mark: #00EDFF;  /* the IGI logo mark only — never body UI */\n\n  /* --- Gold / amber (accent, \"kingdom\" highlight) --- */\n  --gold-500: #FFCD57;   /* primary gold accent — highlights, progress fills */\n  --gold-400: #FFDD88;   /* gold gradient light stop */\n  --gold-600: #F5B91F;\n  --gold-700: #C99A1E;   /* line charts, gold strokes */\n  --gold-ink: #B0801A;   /* gold used as TEXT / eyebrow labels */\n  --gold-ink-deep: #6E5A1E;\n\n  /* --- Teal (positive / verified / success) --- */\n  --teal-500: #0E8A86;   /* success text, positive deltas, \"on track\" */\n  --teal-400: #16A39A;\n  --teal-300: #14A6B8;\n\n  /* --- Blue (secondary / links / digital) --- */\n  --blue-600: #0B5A8C;   /* links, secondary data, \"digital\" category */\n\n  /* --- Warm-paper neutrals --- */\n  --paper: #FAF9F5;      /* app canvas background */\n  --paper-2: #F6F5F1;    /* table header / subtle fill */\n  --paper-3: #F4F1EA;    /* header bar */\n  --surface: #FFFFFF;    /* cards */\n  --surface-input: #FCFCFA;\n\n  /* --- Ink (text) --- */\n  --ink-900: #1F1E1D;    /* headings, primary values */\n  --ink-700: #3A3E42;    /* strong body */\n  --ink-500: #69727D;    /* body text */\n  --ink-400: #808285;    /* labels */\n  --ink-300: #9AA0A6;    /* muted / captions */\n\n  /* --- Borders / hairlines --- */\n  --border: #E7E5DF;     /* default card + control border */\n  --border-2: #EDECE7;   /* inner hairline / table rows */\n  --border-3: #DEDCD5;   /* input border */\n  --track: #ECEBE6;      /* progress-bar track */\n\n  /* --- Soft tint fills (badges, icon chips) --- */\n  --tint-teal: #E2F6F4;   --tint-teal-border: #BCE7E1;\n  --tint-gold: #FFF2D2;   --tint-gold-border: #F0E2B8;\n  --tint-blue: #E4F0F6;\n  --tint-neutral: #EFEEEA;\n  --tint-gold-soft: #FFF6E0; --tint-gold-soft-border: #F6E2B4;\n\n  /* --- Semantic error --- */\n  --error-600: #C0432A;\n  --error-500: #B23A22;\n  --error-tint: #FDF1EE;\n  --error-border: #F1C9BD;\n\n  /* --- Dark-card foreground helpers (on navy) --- */\n  --on-navy: #FFFFFF;\n  --on-navy-soft: #C3D6E6;\n  --on-navy-muted: #93AFC6;\n  --on-navy-dim: #7C96AE;\n  --on-navy-label: #5F7B97;\n\n  /* ---- Semantic aliases ---- */\n  --bg-app: var(--paper);\n  --bg-card: var(--surface);\n  --text-heading: var(--ink-900);\n  --text-body: var(--ink-500);\n  --text-label: var(--ink-400);\n  --text-muted: var(--ink-300);\n  --text-link: var(--blue-600);\n  --eyebrow: var(--gold-ink);\n  --accent: var(--gold-500);\n  --positive: var(--teal-500);\n  --brand: var(--navy-700);\n}\n<\u002Fstyle>\n  <style>/* ============================================================\n   IGI · Gospel Impact — Typography tokens\n   Newsreader (serif display) · IBM Plex Sans (UI) · IBM Plex Mono (data)\n   ============================================================ */\n:root {\n  --font-serif: 'Newsreader', Georgia, 'Times New Roman', serif;   /* display headings, big numbers */\n  --font-sans: 'IBM Plex Sans', system-ui, -apple-system, sans-serif; /* all UI + body */\n  --font-mono: 'IBM Plex Mono', ui-monospace, 'SFMono-Regular', monospace; /* figures, amounts, dates */\n\n  /* Weights */\n  --fw-regular: 400;  /* @kind font */\n  --fw-medium: 500;   /* @kind font */\n  --fw-semibold: 600; /* @kind font */\n  --fw-bold: 700;     /* @kind font */\n\n  /* Type scale (px, as used across the portal) */\n  --fs-display: 40px;   /* hero serif */\n  --fs-h1: 32px;        /* page title serif */\n  --fs-h2: 26px;        /* section / modal serif */\n  --fs-stat: 27px;      /* stat-card figure serif */\n  --fs-title: 15px;     /* card / row title */\n  --fs-body: 14px;      /* body */\n  --fs-body-sm: 13px;   /* dense body */\n  --fs-label: 12.5px;   /* form labels */\n  --fs-meta: 12px;      /* meta / captions */\n  --fs-eyebrow: 12px;   /* uppercase eyebrow */\n  --fs-micro: 11px;     /* nav section labels */\n\n  /* Eyebrow / label treatment */\n  --tracking-eyebrow: 1.6px;   /* uppercase gold eyebrow above titles */\n  --tracking-nav: 1.5px;       /* sidebar section labels */\n  --tracking-tight: -0.6px;    /* serif headline negative tracking */\n\n  --lh-tight: 1.05;   /* @kind font */\n  --lh-heading: 1.14; /* @kind font */\n  --lh-body: 1.55;    /* @kind font */\n}\n<\u002Fstyle>\n  <style>/* ============================================================\n   IGI · Gospel Impact low<\u002Fspan>\n            <span style=\"font-family:var(--font-mono); font-size:12px; font-weight:700; color:var(--gold-ink); margin-left:auto;\">$0.91 / served<\u002Fspan>\n          <\u002Fdiv>\n          <button class=\"no-print\" sc-camel-on-click=\"{{ direct2 }}\" style=\"cursor:pointer; margin-top:2px; border:none; background:var(--navy-700); color:var(--on-navy); font-family:var(--font-sans); font-size:12px; font-weight:600; padding:9px 12px; border-radius:var(--radius-md); box-shadow:var(--shadow-btn); display:flex; align-items:center; justify-content:center; gap:6px;\">Direct $30,000 →<\u002Fbutton>\n        <\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fdiv>\n  <\u002Fsc-if>\n\n  <!-- ===== HOW TO USE ===== -->\n  <div style=\"margin-top:30px; padding:18px 20px; background:var(--paper-2); border:1px solid var(--border); border-radius:var(--radius-lg); break-inside:avoid;\">\n    <div style=\"font-family:var(--font-sans); font-size:11px; letter-spacing:1.4px; text-transform:uppercase; color:var(--gold-ink); font-weight:600; margin-bottom:10px;\">How to use<\u002Fdiv>\n    <ul style=\"margin:0; padding-left:18px; font-family:var(--font-sans); font-size:12.5px; color:var(--ink-500); line-height:1.7;\">\n      <li>The Section C amount fields are inputs you can change — subtotals and the “still unallocated” figure flex as you decide.<\u002Fli>\n      <li>Confirmed (A) and In Discussion (B) numbers are committed inputs; every subtotal, percentage, and remaining figure is calculated.<\u002Fli>\n      <li>Fill in Section C to direct the “still unallocated” balance toward the {{ targetStr }} vision.<\u002Fli>\n    <\u002Ful>\n  <\u002Fdiv>\n\n  <!-- ===== FOOTER ===== -->\n  <div style=\"margin-top:26px; padding-top:14px; border-top:1px solid var(--border); display:flex; justify-content:space-between; align-items:center; gap:16px;\">\n    <div style=\"font-family:var(--font-serif); font-style:italic; font-size:12.5px; color:var(--ink-400); max-width:62%; line-height:1.5;\">“Let us love not with words or speech but with actions and in truth.” — 1 John 3:18<\u002Fdiv>\n    <div style=\"text-align:right; font-family:var(--font-mono); font-size:10px; color:var(--ink-300); line-height:1.6;\">Innovations for Gospel Impact · EIN 88-3526522<br>91.3¢ of every $1 goes to ministry<\u002Fdiv>\n  <\u002Fdiv>\n\n<\u002Fx-import>\n<\u002Fx-dc>\n<script type=\"text/x-dc\" data-dc-script=\"\" data-props=\"{&quot;$preview&quot;:{&quot;width&quot;:&quot;850&quot;,&quot;height&quot;:&quot;1100&quot;},&quot;givingTarget&quot;:{&quot;editor&quot;:&quot;int&quot;,&quot;default&quot;:400000,&quot;tsType&quot;:&quot;number&quot;,&quot;unit&quot;:&quot;$&quot;,&quot;section&quot;:&quot;Plan&quot;,&quot;min&quot;:100000,&quot;max&quot;:1000000,&quot;step&quot;:25000},&quot;showVetted&quot;:{&quot;editor&quot;:&quot;boolean&quot;,&quot;default&quot;:true,&quot;tsType&quot;:&quot;boolean&quot;,&quot;section&quot;:&quot;Plan&quot;},&quot;confidential&quot;:{&quot;editor&quot;:&quot;boolean&quot;,&quot;default&quot;:true,&quot;tsType&quot;:&quot;boolean&quot;,&quot;section&quot;:&quot;Plan&quot;}}\">\nclass Component extends DCLogic {\n  constructor(props){\n    super(props);\n    this.state = { opp: [0, 0, 0, 0], disc: [26000, 10000, 5000, 6000] };\n  }\n\n  money(n){ return '$' + Math.round(n).toLocaleString('en-US'); }\n\n  pct(frac){\n    const v = frac * 100;\n    const r = Math.round(v * 100) / 100;\n    return r + '%';\n  }\n\n  setOpp(i, raw){\n    const digits = String(raw).replace(/[^0-9]/g, '');\n    const v = digits === '' ? 0 : Math.min(9999999, parseInt(digits, 10));\n    this.setState((s) => {\n      const n = s.opp.slice();\n      n[i] = v;\n      return { opp: n };\n    });\n  }\n\n  setDisc(i, raw){\n    const digits = String(raw).replace(/[^0-9]/g, '');\n    const v = digits === '' ? 0 : Math.min(9999999, parseInt(digits, 10));\n    this.setState((s) => {\n      const n = s.disc.slice();\n      n[i] = v;\n      return { disc: n };\n    });\n  }\n\n  addOpp0(amt){\n    this.setState((s) => {\n      const n = s.opp.slice();\n      n[0] = n[0] + amt;\n      return { opp: n };\n    });\n  }\n\n  renderVals(){\n    const target = this.props.givingTarget ?? 400000;\n    const confirmed = 208000;\n    const disc = this.state.disc;\n    const inDisc = disc.reduce((a, b) => a + b, 0);\n    const planned = confirmed + inDisc;\n    const remaining = target - planned;\n\n    const opp = this.state.opp;\n    const oppTotal = opp.reduce((a, b) => a + b, 0);\n    const stillUn = remaining - oppTotal;\n    const directed = planned + oppTotal;\n    const directedPct = Math.max(0, Math.min(100, (directed / target) * 100));\n\n    const remainingMsg = stillUn > 0\n      ? 'Direct this balance through Section C to reach the ' + this.money(target) + ' vision.'\n      : (stillUn === 0\n        ? 'Fully directed — the ' + this.money(target) + ' vision is met.'\n        : 'Over target by ' + this.money(-stillUn) + ' — trim an allocation above.');\n\n    return {\n      confidential: this.props.confidential ?? true,\n      showVetted: this.props.showVetted ?? true,\n\n      targetStr: this.money(target),\n      inDiscStr: this.money(inDisc),\n      inDiscPctStr: this.pct(inDisc / target),\n      plannedStr: this.money(planned),\n      disc0: disc[0], disc1: disc[1], disc2: disc[2], disc3: disc[3],\n      discPct0: this.pct(disc[0] / target),\n      discPct1: this.pct(disc[1] / target),\n      discPct2: this.pct(disc[2] / target),\n      discPct3: this.pct(disc[3] / target),\n      onDisc0: (e) => this.setDisc(0, e.target.value),\n      onDisc1: (e) => this.setDisc(1, e.target.value),\n      onDisc2: (e) => this.setDisc(2, e.target.value),\n      onDisc3: (e) => this.setDisc(3, e.target.value),\n      oppTotalStr: this.money(oppTotal),\n      oppPctStr: this.pct(oppTotal / target),\n      stillUnStr: this.money(stillUn),\n      directedStr: this.money(directed),\n      directedPctStr: Math.round(directedPct) + '%',\n      directedPctW: directedPct + '%',\n      remainingMsg,\n\n      opp0: opp[0], opp1: opp[1], opp2: opp[2], opp3: opp[3],\n      pct0: this.pct(opp[0] / target),\n      pct1: this.pct(opp[1] / target),\n      pct2: this.pct(opp[2] / target),\n      pct3: this.pct(opp[3] / target),\n\n      onOpp0: (e) => this.setOpp(0, e.target.value),\n      onOpp1: (e) => this.setOpp(1, e.target.value),\n      onOpp2: (e) => this.setOpp(2, e.target.value),\n      onOpp3: (e) => this.setOpp(3, e.target.value),\n\n      direct0: () => this.addOpp0(40000),\n      direct1: () => this.addOpp0(35000),\n      direct2: () => this.addOpp0(30000),\n    };\n  }\n}\n<\u002Fscript>\n\n\n<\u002Fbody><\u002Fhtml>"
  </script>
